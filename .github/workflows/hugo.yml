name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          tarball=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "${tarball}" hugo
          sudo install hugo /usr/local/bin/hugo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # baseURL comes from hugo.toml (https); configure-pages reports http://
      # while HTTPS isn't enforced on the repo.
      - name: Build
        run: hugo --minify
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
